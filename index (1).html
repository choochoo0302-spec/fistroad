<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050507;color:#eee;overflow:hidden;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;overflow:hidden;background:#000;flex:none}
#cv{width:100%;height:100%;display:block}

#controls{transition:opacity .2s}

.cluster{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
body.landscape #bottom{position:fixed;pointer-events:none}
body.landscape #mute{bottom:auto;left:auto;top:13%;right:10px}

#controls button{position:relative;border:none;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;font-family:"Noto Sans KR",sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 0 rgba(0,0,0,.5);transition:transform .05s,filter .05s}

#controls .mv{background:linear-gradient(#3c4250,#262a33)}

#controls .pu.hv{background:linear-gradient(#e2632b,#a33e14)}

#dialog{cursor:pointer;background:linear-gradient(#0e0e16,#0a0a10);border-top:2px solid rgba(255,255,255,.12)}

#dname{display:inline-block;font-weight:900;font-size:clamp(13px,3.4vw,18px);padding:2px 12px;border-radius:4px;margin-bottom:8px;background:#444}

#dtext{font-size:clamp(14px,3.9vw,20px);line-height:1.65;white-space:pre-wrap;word-break:keep-all;color:#f2f2f2}

.panel{width:min(100%,720px);background:linear-gradient(#14151c,#0c0d12);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;text-align:center;margin:auto}

.score{margin:10px auto;border-collapse:collapse;font-size:14px}.score td{padding:4px 10px;border-bottom:1px solid rgba(255,255,255,.08)}

.tcard:disabled{opacity:.38;cursor:default}.diet{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.dchip{font-family:inherit;border:1px solid rgba(255,255,255,.16);background:#1a1c24;color:#ddd;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer}.dchip small{display:block;font-size:10px;font-weight:500;opacity:.7}.dchip.on{background:linear-gradient(#e53935,#b71c1c);border-color:#ff8a80;color:#fff}.ladder{display:grid;gap:6px;margin-top:10px}.ladder button{font-family:inherit;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid rgba(255,255,255,.14);background:linear-gradient(#1d2029,#14161d);color:#eee;border-radius:10px;padding:9px 12px;cursor:pointer}.ladder button:disabled{opacity:.35}.ladder b{font-size:15px}.ladder small{opacity:.7;font-size:11.5px}

body.landscape .tm-pv{width:min(22%,40vh);min-width:120px}

.tcat{font-weight:900;font-size:13px;color:#ffb74d;margin:14px 0 -4px;letter-spacing:1px}
input{user-select:text;-webkit-user-select:text}
.cr{width:min(100%,780px);margin:auto;text-align:left}.cr h2{text-align:center}
.cr-body{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.cr-pv{flex:0 0 auto;width:min(40%,230px);min-width:140px;background:radial-gradient(circle at 50% 35%,#2b2f3a,#111318);border-radius:12px;border:1px solid rgba(255,255,255,.1);position:relative}

.stylebox{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stylebox .chip{text-align:left}.stylebox .chip small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:3px;line-height:1.35}

.cloud{font-size:12px;margin-top:8px;color:#9ccc65}.cloud.off{color:#bbb}

.guide{max-width:470px;text-align:left}.guide h2,.guide .sheet-ic{text-align:center}
.gsteps{display:grid;gap:10px;margin-top:14px}.gsteps>div{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.gsteps b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff6a3d,#e0245e);font-weight:900}
.gsteps em{display:block;font-style:normal;font-weight:900;font-size:15px;margin-bottom:2px}.gsteps span{font-size:13px;opacity:.9}
.newsbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;width:100%;font-family:inherit;text-align:left;color:#fff;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,213,79,.3);background:linear-gradient(90deg,rgba(255,179,0,.16),rgba(255,255,255,.03));cursor:pointer;overflow:hidden;min-height:44px}
.nb-tag{flex:none;font-size:11px;font-weight:900;letter-spacing:2px;padding:4px 8px;border-radius:8px;background:#ffca28;color:#2a1600}
.nb-txt{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nb-txt.in{animation:nbIn .45s ease}@keyframes nbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rtabs{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}.rtabs button{font-family:inherit;font-weight:800;font-size:13.5px;color:#ddd;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);cursor:pointer}.rtabs button.on{background:linear-gradient(135deg,#ffca28,#ff8f00);color:#2a1600;border-color:transparent}
.rkbody{display:grid;gap:6px}
.rkrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.rkrow.me{border-color:rgba(255,202,40,.7);background:rgba(255,202,40,.1)}.rk-n{font-size:20px;font-weight:900;text-align:center}.rk-name b{display:block;font-size:16px}.rk-name small,.rk-sc small{font-size:11.5px;opacity:.7}.rk-sc{text-align:right}.rk-sc b{display:block;font-size:17px;color:#ffd54f}
.newslist{display:grid;gap:8px}.champ{display:grid;grid-template-columns:auto auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.champ .cm-m{grid-row:1/3;font-weight:900;font-size:13px;color:#ffca28;min-width:84px}.champ .cm-c{grid-row:1/3;font-size:26px}.champ b{font-size:18px}.champ small{font-size:12px;opacity:.7;grid-column:3}
.champ.top{background:linear-gradient(135deg,rgba(255,202,40,.22),rgba(255,111,0,.1));border-color:rgba(255,202,40,.6)}.champ.top b{font-size:22px}
.nitem{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.nitem b{display:block}.nitem small{opacity:.6;font-size:11.5px}.tile.wide{grid-column:1/-1;min-height:96px}.rrow.lock{background:rgba(255,179,0,.05);border-color:rgba(255,179,0,.25)}.rrow .buy{width:auto;padding:10px 14px;font-size:14px;white-space:nowrap}.tbtn.admin.on{background:rgba(255,213,79,.25);border-color:#ffd54f}
/* ===== v10 modern UI ===== */
#menu{background:radial-gradient(120% 90% at 50% -10%,rgba(70,24,40,.7),rgba(6,6,10,.94) 60%);}
.panel{background:linear-gradient(160deg,rgba(34,36,50,.86),rgba(13,14,20,.92));border:1px solid rgba(255,255,255,.08);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);padding:24px}
.panel .sub{color:#ff7a59;letter-spacing:5px;font-weight:900;font-size:12px}
.btns button,.btn{border-radius:14px;padding:12px 24px;background:linear-gradient(135deg,#ff6a3d,#e0245e);box-shadow:0 10px 26px rgba(224,36,94,.32);transition:transform .12s,box-shadow .12s,filter .12s}
.btns button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btns button:active{transform:scale(.97);box-shadow:0 4px 12px rgba(224,36,94,.3)}
.btns button.alt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);box-shadow:none;color:#e9e9f0}
.btns button.danger{background:linear-gradient(135deg,#ff4d4f,#b3001b);box-shadow:0 10px 26px rgba(255,60,60,.3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
.title-p .tag{opacity:.8;margin-top:10px}
.ccard{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;margin:18px 0 6px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,106,61,.16),rgba(124,92,255,.12));border:1px solid rgba(255,255,255,.12)}
.ccard small{opacity:.65;font-size:11px;letter-spacing:2px}.cc-name{font-family:"Black Han Sans",sans-serif;font-size:28px;line-height:1.1}
.cc-r{display:flex;flex-direction:column;gap:6px}
.pbtn,.dbtn{font-family:inherit;font-weight:900;border:none;border-radius:12px;cursor:pointer;white-space:nowrap}
.pbtn{padding:12px 18px;font-size:16px;color:#fff;background:linear-gradient(135deg,#ff6a3d,#e0245e);box-shadow:0 8px 20px rgba(224,36,94,.35)}
.dbtn{padding:7px 12px;font-size:12.5px;color:#ff7b7b;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.35)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px}
.tbtn{font-family:inherit;font-weight:800;font-size:14px;color:#eee;padding:12px 8px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s,background .12s}
.tbtn span{font-size:22px}.tbtn:active{transform:scale(.96)}.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn.main{grid-column:1/-1;flex-direction:row;justify-content:center;font-size:18px;color:#fff;background:linear-gradient(135deg,#ff6a3d,#e0245e);border:none;box-shadow:0 10px 26px rgba(224,36,94,.35)}
.tbtn.danger{color:#ff7b7b;border-color:rgba(255,80,80,.35);background:rgba(255,80,80,.07)}
.sheet{max-width:440px}.sheet-ic{font-size:40px;margin-bottom:4px}
.hub{width:min(100%,900px);margin:auto;display:grid;grid-template-columns:minmax(230px,310px) 1fr;gap:14px;align-items:start}
@media (max-width:620px){.hub{grid-template-columns:1fr}}
.topbar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.logo{font-family:"Black Han Sans",sans-serif;font-size:22px;letter-spacing:1px}.logo span{color:#ff6a3d}
.iconbtn{font-family:inherit;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer}
.pcard{text-align:left;padding:16px;border-radius:24px;background:linear-gradient(160deg,rgba(34,36,50,.86),rgba(13,14,20,.92));border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pcard small{opacity:.65;font-size:12px}.pname{font-family:"Black Han Sans",sans-serif;font-size:32px;line-height:1.1}
.pcard canvas{width:100%;display:block;border-radius:16px;margin:6px 0 10px;background:radial-gradient(circle at 50% 45%,rgba(255,106,61,.2),rgba(255,255,255,.02) 70%)}
.mstat{display:grid;grid-template-columns:46px 1fr 26px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.mstat i{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;display:block}
.mstat i b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ff6a3d,#ffc35a)}
.mstat em{font-style:normal;font-weight:900;text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{font-family:inherit;text-align:left;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;min-height:132px;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 16px 36px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .14s}
.tile:hover{transform:translateY(-2px)}.tile:active{transform:scale(.97)}
.tile .ic{font-size:30px;display:block}.tile b{display:block;font-size:20px;font-weight:900;margin-top:8px}.tile small{display:block;font-size:12.5px;opacity:.88;margin-top:3px}
.pcard canvas{max-height:min(210px,30vh);object-fit:contain}
@media (max-height:520px){.title-p h1{font-size:54px}.title-p .tag{margin-top:4px}.ccard{margin:10px 0 4px;padding:10px 14px}.tgrid{margin-top:10px}.tbtn{padding:8px}.tbtn span{font-size:18px}.tile{min-height:112px;padding:14px}}
.tbtn.admin{color:#ffd54f;border-color:rgba(255,213,79,.45);background:rgba(255,213,79,.08)}.adm{max-width:520px;text-align:left}.adm h2,.adm .sub,.adm>.hint{text-align:center}.agrp{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.agrp>b{display:block;font-size:13px;color:#ffd54f;margin-bottom:6px}.asl{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin:4px 0}.asl input{width:100%;accent-color:#ff6a3d}.asl em{font-style:normal;font-weight:900;text-align:right}#notice{position:fixed;left:50%;top:-80px;transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,#ffb300,#ff6a3d);color:#1a0d00;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:top .35s}#notice.show{top:max(12px,env(safe-area-inset-top))}
.tile .bgic{position:absolute;right:-12px;bottom:-22px;font-size:96px;opacity:.13;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="tip" class="hidden"></div><button id="mute" aria-label="소리">🔊</button><button id="pausebtn" class="hidden" aria-label="메뉴">⏸</button><button id="spbtn" class="hidden"><b>필살기</b><small></small></button><div id="toast" class="hidden"></div><button id="endbtn" class="hidden">운동 끝내기</button><button id="tapbtn" class="hidden">1회!</button></div>
  <div id="bottom">
    <div id="controls" class="off">
      <div class="cluster L">
        <button class="mv" data-act="back"><b>◀</b><i>뒤로</i></button>
        <button class="mv" data-act="fwd"><b>▶</b><i>앞으로</i></button>
        <button class="df" data-act="guard"><b>가드</b><i>누르고 있기</i></button>
        <button class="df" data-act="dodge"><b>회피</b><i>더킹</i></button>
      </div>
      <div class="cluster R">
        <button class="pu" data-act="jab"><b>잽</b><i>빠름</i></button>
        <button class="pu" data-act="straight"><b>스트레이트</b><i>강함</i></button>
        <button class="pu hv" data-act="hook"><b>훅</b><i>근거리</i></button>
        <button class="pu hv" data-act="upper"><b>어퍼</b><i>근거리</i></button>
      </div>
    </div>
    <div id="dialog" class="hidden"><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
    <div id="choice" class="hidden"></div>
  </div>
  <div id="menu" class="hidden"></div>
</div>

function runPose(ph){const s=Math.sin(ph),c=Math.cos(ph),P=copyPose(PS.stand);P.hy=-146-Math.abs(s)*6;P.ln=.18;P.hd=-.1;P.lfx=12+32*s;P.lfy=-Math.max(0,c)*24;P.rfx=12-32*s;P.rfy=-Math.max(0,-c)*24;P.lgx=34-24*s;P.lgy=-190+6*c;P.rgx=34+24*s;P.rgy=-186-6*c;return P;}

function ik(ax,ay,bx,by,l1,l2,sign){let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy)||.001;const mx=l1+l2-.5;if(d>mx){bx=ax+dx/d*mx;by=ay+dy/d*mx;dx=bx-ax;dy=by-ay;d=mx;}const dd=Math.max(d,Math.abs(l1-l2)+2);const a=Math.acos(clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1)),base=Math.atan2(dy,dx),an=base+sign*a;return{jx:ax+Math.cos(an)*l1,jy:ay+Math.sin(an)*l1,ex:bx,ey:by};}
function limb(c,ax,ay,bx,by,w1,wm,w2,col,far,bul){bul=bul||0;const dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,mx=(ax+bx)/2,my=(ay+by)/2;
 const ls=(nx*.6-ny*.8)>0?1:-1;const g=c.createLinearGradient(mx+nx*wm*.55*ls,my+ny*wm*.55*ls,mx-nx*wm*.55*ls,my-ny*wm*.55*ls);
 if(far){g.addColorStop(0,shade(col,.04));g.addColorStop(.4,col);g.addColorStop(1,shade(col,-.42));}else{g.addColorStop(0,shade(col,.02));g.addColorStop(.2,shade(col,.3));g.addColorStop(.46,col);g.addColorStop(.76,shade(col,-.4));g.addColorStop(.9,shade(col,-.34));g.addColorStop(1,shade(col,-.16));}c.fillStyle=g;
 const an=Math.atan2(ny,nx);c.beginPath();c.moveTo(ax+nx*w1/2,ay+ny*w1/2);c.quadraticCurveTo(mx+nx*(wm/2+bul),my+ny*(wm/2+bul),bx+nx*w2/2,by+ny*w2/2);
 c.arc(bx,by,w2/2,an,an+Math.PI,true);c.quadraticCurveTo(mx-nx*(wm/2+bul),my-ny*(wm/2+bul),ax-nx*w1/2,ay-ny*w1/2);c.arc(ax,ay,w1/2,an+Math.PI,an,true);c.closePath();if(LIMB_SH)shOn(c);c.fill();if(LIMB_SH)shOff(c);c.lineWidth=1;c.strokeStyle='rgba(20,10,6,.13)';c.stroke();
 if(!far&&LIGHT_Q){const o=wm*.26*ls,sw=Math.max(1,wm*.13);c.strokeStyle='rgba(255,255,255,.16)';c.lineWidth=sw;c.lineCap='round';c.beginPath();c.moveTo(lerp(ax,mx,.35)+nx*o,lerp(ay,my,.35)+ny*o);c.quadraticCurveTo(mx+nx*(o+bul*.5*ls),my+ny*(o+bul*.5*ls),lerp(bx,mx,.35)+nx*o,lerp(by,my,.35)+ny*o);c.stroke();c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=sw*.4;c.stroke();}}

function brC(sev,a){const k=clamp(sev*1.25);return`rgba(${Math.round(lerp(196,88,k))},${Math.round(lerp(48,28,k))},${Math.round(lerp(58,96,k))},${a})`;}
function bruise(c,x,y,rx,ry,sev,a=1){if(!(sev>.04))return;sev=Math.min(1.2,sev);c.save();c.translate(x,y);c.scale(1,ry/rx);const g=c.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,brC(sev,Math.min(.78,sev*.9)*a));g.addColorStop(.5,brC(sev*.85,Math.min(.5,sev*.6)*a));g.addColorStop(1,brC(sev,0));c.fillStyle=g;c.beginPath();c.arc(0,0,rx,0,6.3);c.fill();
 if(sev>.55){c.fillStyle=`rgba(255,215,225,${(sev-.55)*.35*a})`;c.beginPath();c.ellipse(-rx*.25,-rx*.3,rx*.35,rx*.18,-.3,0,6.3);c.fill();}c.restore();}
function bloodPath(c,pts,w,len){let tot=0;const sg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);sg.push(d);tot+=d;}let Lr=tot*clamp(len);const out=[pts[0]];
 for(let i=1;i<pts.length&&Lr>0;i++){const d=sg[i-1];if(Lr>=d){out.push(pts[i]);Lr-=d;}else{const k=Lr/d;out.push([lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k)]);Lr=0;}}
 if(out.length<2)return out[0];const n=out.length,Lf=[],Rt=[],sd=pts[0][0]*3.1;
 for(let i=0;i<n;i++){const a=out[Math.max(0,i-1)],b=out[Math.min(n-1,i+1)],tx=b[0]-a[0],ty=b[1]-a[1],l=Math.hypot(tx,ty)||1,nx=-ty/l,ny=tx/l,u=i/(n-1),hw=w*.5*(.55+.3*u+.12*Math.sin(i*1.9+sd));Lf.push([out[i][0]+nx*hw,out[i][1]+ny*hw]);Rt.push([out[i][0]-nx*hw,out[i][1]-ny*hw]);}
 const e=out[n-1],shape=()=>{c.beginPath();c.moveTo(Lf[0][0],Lf[0][1]);for(let i=1;i<n;i++)c.lineTo(Lf[i][0],Lf[i][1]);c.arc(e[0],e[1],w*.55,0,6.3);for(let i=n-1;i>=0;i--)c.lineTo(Rt[i][0],Rt[i][1]);c.closePath();};
 shape();c.fillStyle='rgba(122,6,14,.93)';c.fill();c.strokeStyle='rgba(50,0,4,.45)';c.lineWidth=.4;c.stroke();
 c.beginPath();c.arc(e[0],e[1],w*.6,0,6.3);c.fillStyle='rgba(100,4,10,.95)';c.fill();
 c.strokeStyle='rgba(255,165,165,.42)';c.lineWidth=Math.max(.3,w*.16);c.lineCap='round';c.beginPath();const m=Math.max(2,Math.floor(n*.75));c.moveTo((Lf[0][0]+out[0][0])/2,(Lf[0][1]+out[0][1])/2);for(let i=1;i<m;i++)c.lineTo((Lf[i][0]*.6+out[i][0]*.4),(Lf[i][1]*.6+out[i][1]*.4));c.stroke();
 c.fillStyle='rgba(255,200,200,.5)';c.beginPath();c.arc(e[0]-w*.18,e[1]-w*.12,w*.16,0,6.3);c.fill();return e;}
function bdrop(c,x,y,r,a=1){c.globalAlpha=a;c.fillStyle='#930d16';c.beginPath();c.moveTo(x,y-r*1.7);c.quadraticCurveTo(x+r*1.05,y-r*.1,x,y+r);c.quadraticCurveTo(x-r*1.05,y-r*.1,x,y-r*1.7);c.fill();c.fillStyle='rgba(255,180,180,.6)';c.beginPath();c.arc(x-r*.3,y-r*.15,r*.28,0,6.3);c.fill();c.globalAlpha=1;}

function liftORM(k){const T=TRAIN[k],mp=G.mp||{},pv=T&&T.part?[...T.part].reduce((a,p)=>a+(mp[p]||0),0)/T.part.length:(G.mus||0);return LIFT[k].orm(G.stats)*(1+pv/160);}

function applyGain(key,score,opt){opt=opt||{};initBody();const T=TRAIN[key],before={...G.stats};let note=null,inj=null;

 const fm=clamp(1-G.fatigue/150,.3,1),dim=v=>clamp(1.1-v/92,.07,1),rr=v=>Math.floor(v)+(Math.random()<v%1?1:0);
 const gm=Math.max(1,rr((1.6+3.2*score)*fm*dim(G.stats[T.main]))),gs=rr((.5+1.4*score)*fm*dim(G.stats[T.sub]));
 G.stats[T.main]=Math.min(99,G.stats[T.main]+gm);G.stats[T.sub]=Math.min(99,G.stats[T.sub]+gs);
 let musK=1;if(opt.int!=null&&opt.reps>0){
  if(opt.int>=.8){const b=Math.max(1,rr(1.5*score*fm*dim(G.stats.pow)));G.stats.pow=Math.min(99,G.stats.pow+b);musK=1.5;note=`고중량 세트 — 파워 +${b}, 근육 자극 강함`;}
  else if(opt.int>=.62){musK=1.3;note='근비대 세트 — 근육 자극 좋음';}
  else{const b=Math.max(1,rr(1.5*score*fm*dim(G.stats.sta)));G.stats.sta=Math.min(99,G.stats.sta+b);musK=.6;note=`고반복 세트 — 지구력 +${b}`;}
  if(opt.load&&opt.reps>0&&opt.load>(G.pr[key]||0)){G.pr[key]=Math.round(opt.load*10)/10;note=(note?note+'<br>':'')+`🏆 개인 기록 갱신 — ${G.pr[key]}kg`;}}
 if(T.mus&&T.part)for(const p of T.part)G.pend[p]+=T.mus*(.6+score)*fm*musK/T.part.length;
 G.en=Math.max(0,G.en-T.en);G.burn+=T.kcal*(.7+score*.5);G.slot++;
 G.fatigue=clamp(G.fatigue+T.fat*(opt.int?.7+opt.int*.5:1),0,100);
 if(T.part&&G.fatigue>72&&Math.random()<(G.fatigue-72)/70){const p=T.part[ri(0,T.part.length-1)];G.inj[p]=ri(2,4);inj=`🤕 ${PART_NM[p]} 부상! ${G.inj[p]}일 동안 ${PART_NM[p]} 운동을 못 한다.`;}
 return{before,note,inj};}
function sleepDay(){initBody();const D=FOOD[G.food]||FOOD.normal,b0=taesanBuild(),w0=G.cus.w,bf0=G.bf,mp0={...G.mp};
 const q=clamp(1.15-G.fatigue/200,.6,1.1);let lean=0;
 for(const p in G.mp){let g=G.pend[p]*D.pf*q*clamp(1.25-G.mp[p]/48,.2,1)*.55;if(G.food==='cut')g*=.8;G.mp[p]=Math.min(45,G.mp[p]+g);lean+=g*.11;}
 const kcal=D.kcal-G.burn*.55,fatKg=w0*bf0/100+kcal/7700;

class Work extends Mini{
 constructor(k,add,cb){const E=EX[k],L=LIFT[k];super(TRAIN[k].nm,'누를 때마다 1회 · 한계까지 하거나 원할 때 끝낸다',cb,E.bg,{tap:'1회!'});this.k=k;this.E=E;this.Lf=L;this.add=add;this.load=liftLoad(k,add);this.orm=liftORM(k);this.it=this.load/this.orm;this.mr=maxReps(this.orm,this.load);this.target=Math.max(1,Math.min(this.mr,Math.round(7/this.it)));
  this.q=0;this.rep=-1;this.vol=0;this.fail=0;this.L=GLOOK();}
 input(){if(this.fail>0)return;this.q=Math.min(2,this.q+1);}
 play(){const E=this.E;if(this.fail>0){if(--this.fail===0)this.end(this.count?'더 이상 올라가지 않는다 — 한계까지 했다':'너무 무겁다. 한 번도 못 들었다');return;}
  if(this.rep<0&&this.q>0){this.q--;if(this.count>=this.mr){this.fail=110;this.rep=0;this.failing=true;this.fx.text(600,170,'으으윽...!','#ff8a65',30);SFX.bad();return;}this.rep=0;}
  if(this.rep>=0&&!this.failing){const near=this.mr>0?Math.pow(this.count/this.mr,3):1,dur=(14+26*this.it*this.it)*(1+near*1.6);const sp=1/dur;this.rep+=sp;if(this.rep>=.5&&this.rep-sp<.5)(E.plate?SFX.bag:SFX.step)(2+this.it*3);
   if(this.rep>=1){this.rep=-1;this.vol+=this.it;this.cheer();if(this.count%3===0)this.fx.sweat(E.x,GROUND-260,1,4);}}}
 score(){return this.vol/7;}
 opt(){return{int:this.it,reps:this.count,load:this.load};}
 draw(){this.base();const E=this.E;let k=this.rep>=0?Math.sin(Math.PI*Math.min(1,this.rep)):0;if(this.failing)k=.5+Math.sin(this.fr*.9)*.04;
  const P=lerpPose(E.A,E.B,k),y=E.yA!=null?lerp(E.yA,E.yB,k):GROUND,x=E.x;if(E.prop)E.prop(x);

   ctx.font=`900 13px ${FB}`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(Math.round(this.load)+'kg',px,py-r-8);}

function applySave(d){Object.assign(G,{step:d.step,stats:{...d.stats},flags:{...(d.flags||{})},fatigue:d.fatigue||0,day:d.day||0,cus:Object.assign({...DEF_CUS},d.cus||{}),mus:d.mus||0,wins:d.wins||0,quick:!!d.quick,adds:d.adds||{}});applyCustom();Game.paused=false;hideMenu();hideDialog();Game.run();toast('불러왔다 — '+chapterOf(G.step));}

const PauseUI={main(){const c=G.cus,inFight=Game.scene instanceof Fight;
 showMenu(`<div class="panel"><h2>일시정지</h2><p><b>${esc(c.name)}</b> · ${STYLES[c.style].nm} · ${weightClass(c.w)}<br>${esc(chapterOf(G.step))}</p>${inFight?'<p class="hint" style="font-size:12px">경기 중에 저장하면 그 경기 처음부터 다시 시작해요.</p>':''}${cloudNote()}</div>`,
 [{t:'계속하기',f:resumeGame},{t:'저장하기',f:()=>SaveUI.show('save',()=>PauseUI.main())},{t:'불러오기',alt:true,f:()=>SaveUI.show('load',()=>PauseUI.main())},{t:'저장 코드',alt:true,f:()=>SaveUI.code(()=>PauseUI.main())},{t:AU.muted?'소리 켜기':'소리 끄기',alt:true,f:()=>{AU.mute(!AU.muted);$('mute').textContent=AU.muted?'🔇':'🔊';PauseUI.main();}},{t:'타이틀로',alt:true,f:()=>{Game.paused=false;hideMenu();hideDialog();Game.title();}}]);}};
const SaveUI={
 async show(mode,back){const title=mode==='save'?'저장하기':'불러오기';showMenu(`<div class="panel"><h2>${title}</h2><p>저장 목록을 불러오는 중...</p></div>`);
  const all=await Save.all();
  const rows=Save.SLOTS.map(s=>{const d=all[s],nm=s==='auto'?'자동 저장':'슬롯 '+s;
   const info=d?`${esc(d.cus.name)} · ${STYLES[d.cus.style].nm} · ${esc(chapterOf(d.step))}<br>파워 ${d.stats.pow} · 스피드 ${d.stats.spd} · 지구력 ${d.stats.sta} · 기술 ${d.stats.def} · 맷집 ${d.stats.chin}<br>${fmtTime(d.t)}`:'비어 있음';
   const b=mode==='save'?(s==='auto'?'':`<button data-a="save" data-s="${s}">${d?'덮어쓰기':'저장'}</button>`):`<button data-a="load" data-s="${s}" ${d?'':'disabled'}>불러오기</button>`;
   const del=d&&s!=='auto'?`<button class="alt" data-a="del" data-s="${s}">삭제</button>`:'';
   return`<div class="slot"><div class="si"><b>${nm}</b><span>${info}</span></div>${b}${del}</div>`;}).join('');

   m.querySelectorAll('.slot button').forEach(btn=>btn.addEventListener('click',async e=>{e.stopPropagation();AU.init();const s=btn.dataset.s,a=btn.dataset.a;
    if(a==='save'){Save.write(s);SFX.ok();toast('슬롯 '+s+'에 저장했다');this.show('save',back);}
    else if(a==='load'){if(all[s])applySave(all[s]);}
    else if(a==='del'){btn.disabled=true;await Save.del(s);toast('삭제했다');this.show(mode,back);}}));});},
 code(back,importOnly){const cur=importOnly?'':Save.encode(Save.snap());
  showMenu(`<div class="panel"><h2>저장 코드</h2>${importOnly?'':`<p style="font-size:13px">이 코드를 메모해 두면 다른 기기·브라우저에서 이어할 수 있어요.</p><textarea class="code" id="code-out" readonly>${cur}</textarea>`}

   [...(importOnly?[]:[{t:'코드 복사',f:()=>{const tx=$('code-out');try{navigator.clipboard.writeText(cur).then(()=>toast('복사했다'),()=>{tx.select();toast('길게 눌러 복사하세요');});}catch(e){tx.select();toast('길게 눌러 복사하세요');}}}]),
    {t:'코드로 불러오기',alt:true,f:()=>{const d=Save.decode($('code-in').value);if(!d){toast('코드가 올바르지 않아요');SFX.bad();return;}applySave(d);}},{t:'뒤로',alt:true,f:back}]);}

 if(!s){this.title();return;}hideMenu();hideDialog();showTip(null);resetHeld();endBtn(false);
 switch(s.t){
  case'card':G.hurt=null;saveGame();this.set(new Card(s));break;
  case'dlg':this.set(new Dialog(s));break;
  case'choice':this.set(new Choice(s));break;
  case'fight':saveGame();this.set(new Fight(FIGHTS[s.id],{done:()=>Game.next()}));break;
  case'train':G.hurt=null;saveGame();this.set(new TrainMenu(s,()=>Game.next()));break;
  case'license':this.set(new License(s));break;
  case'epilogue':this.set(new Epilogue());break;
  case'end':this.set(new Ending());break;}};

if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('40px "Black Han Sans"'),document.fonts.load('700 20px "Noto Sans KR"')]),new Promise(r=>setTimeout(r,1800))]).then(boot,boot);}else boot();

<script>

const AI_LADDER=[
 {f:'doksa',st:'boxing',bg:'hall',tag:'동네 싸움꾼'},{f:'dusik',st:'boxing',bg:'gymring',tag:'체육관 선배'},{f:'test',st:'kick',bg:'hall',tag:'프로 데뷔전'},
 {f:'jiho',st:'boxing',bg:'arena',tag:'아마추어 에이스'},{f:'yongpal',st:'wrestle',bg:'hall',tag:'괴력의 거구'},{f:'dojin',st:'muay',bg:'arena',tag:'신인왕'},

 const hai=Object.assign({},a0,{react:Math.max(3,(a0.react||12)-5-Math.round(2*k)),slip:Math.min(.5,(a0.slip||0)+.14+.1*k),block:Math.min(.6,(a0.block||0)+.14),tell:Math.max(3,(a0.tell||12)-5),think:[Math.max(7,th[0]*.55),Math.max(14,th[1]*.55)],counterRate:Math.min(.85,(a0.counterRate||.2)+.3),aggr:Math.min(.92,(a0.aggr||.5)+.18),guardRate:Math.min(.5,(a0.guardRate||.2)+.12)});
 return{title:`AI 대전 ${i+1}단계 · ${A.tag}`,mode:'match',ai:1,estyle:A.st,bg:A.bg,amb:A.bg==='gymring'?'gym':'crowd',pLook:'taesan_box',rounds:3,time:60,
  enemy:Object.assign({},E,{rec:A.tag+' · '+STYLES[A.st].nm,h:E.h||176,rise:[6,8,10],dmgScale:(E.dmgScale||1)*(1.3+.3*k),stats:hs,ai:hai}),shouts:F.shouts,advice:F.advice};}

   b=[{t:'빠른 매칭',f:()=>this.quick()},{t:'방 코드로 대전',f:()=>this.codeUI()},{t:'뒤로',alt:true,f:()=>this.exit()}];}
  showMenu(`<div class="panel"><p class="sub">ONLINE</p><h2>온라인 대전</h2><p>${esc(netName())} · ${STYLES[st].nm} · 온라인 전적 ${netRec()}</p>${body}</div>`,b);}
 wait(msg,sub){showMenu(`<div class="panel"><p class="sub">ONLINE</p><h2>${msg}</h2>${sub?`<p>${sub}</p>`:''}<p class="hint">상대가 들어오면 바로 시작해요.</p></div>`,[{t:'취소',alt:true,f:()=>this.cancel()}]);}
 quick(){this.view='q';this.q=true;this.waitT=0;NET.room.presence({q:1,m:0}).catch(()=>{});this.wait('상대를 찾는 중...');this.tryPair();}
 tryPair(){if(!this.q||this.joining||NET.mr)return;
  const qs=this.peers.filter(p=>p.kind==='viewer'&&p.presence&&p.presence.v===1&&p.presence.q===1).sort((a,b)=>a.peer<b.peer?-1:1);
  const i=qs.findIndex(p=>p.sameTab);if(i<0)return;const o=qs[i^1];if(!o)return;
  this.joinMatch('m'+[netClean(qs[i].peer),netClean(o.peer)].sort().map(s=>s.slice(0,20)).join(''));}
 codeUI(){this.view='code';showMenu(`<div class="panel"><p class="sub">ONLINE</p><h2>방 코드로 대전</h2><p>친구와 같은 숫자 4자리를 넣으면 같은 방에서 만나요.</p><p style="margin-top:12px"><input id="rcode" inputmode="numeric" maxlength="6" placeholder="예: 1234" style="font-size:22px;width:150px;text-align:center;padding:8px;border-radius:10px;border:1px solid #555;background:#111;color:#fff"></p></div>`,
  [{t:'입장',f:()=>{const c=netClean(($('rcode')||{}).value).slice(0,6);if(c.length<3){toast('숫자 3자리 이상 넣어 주세요');return;}this.enterCode(c);}},{t:'새 코드 만들기',alt:true,f:()=>this.enterCode(String(ri(1000,9999)))},{t:'뒤로',alt:true,f:()=>{this.view='main';this.menu();}}]);}
 enterCode(c){this.view='room';this.code=c;this.wait(`방 코드 ${c}`,'친구에게 이 코드를 알려 주세요.');this.joinMatch('c'+c);}
 async joinMatch(name){if(this.joining)return;this.joining=true;let mr;
  try{mr=await NET.room.join(name);}catch(e){this.joining=false;toast('방에 들어가지 못했어요');if(this.view!=='q')this.cancel();return;}
  this.joining=false;if(Game.scene!==this||this.view==='main'){mr.leave().catch(()=>{});return;}
  NET.mr=mr;this.waitT=0;NET.room.presence(this.view==='q'?{q:1,m:1}:{q:0,m:1}).catch(()=>{});mr.presence(netMe()).catch(()=>{});
  this.mrUnsub=mr.onPeers(ch=>this.onMatch(ch.peers));}
 onMatch(peers){if(this.started)return;const ps=peers.filter(p=>p.kind==='viewer'&&p.presence&&p.presence.v===1&&p.presence.L).sort((a,b)=>a.peer<b.peer?-1:1);
  const i=ps.findIndex(p=>p.sameTab);if(i<0)return;if(i>1){toast('방이 가득 찼어요');this.cancel();return;}const o=ps[i^1];if(!o)return;
  this.started=true;this.q=false;NET.room.presence({q:0,m:1}).catch(()=>{});this.cleanup(false);Game.set(new OnlineFight(NET.mr,o));}
 cancel(){this.q=false;if(this.mrUnsub)this.mrUnsub();this.mrUnsub=null;if(NET.mr){NET.mr.leave().catch(()=>{});NET.mr=null;}if(NET.room)NET.room.presence({q:0,m:0}).catch(()=>{});this.view='main';this.menu();}
 cleanup(leaveRoom){if(this.unsub)this.unsub();this.unsub=null;if(this.mrUnsub)this.mrUnsub();this.mrUnsub=null;if(leaveRoom&&NET.mr){NET.mr.leave().catch(()=>{});NET.mr=null;}}

 onPress(){}
 update(){this.fr++;const b=this.b;b.t++;
  if(this.view==='q'&&NET.mr&&!this.started&&++this.waitT>540){const m=NET.mr;NET.mr=null;if(this.mrUnsub)this.mrUnsub();this.mrUnsub=null;m.leave().catch(()=>{});NET.room.presence({q:1,m:0}).catch(()=>{});this.waitT=0;}
  if(this.view==='q'&&!NET.mr&&this.fr%60===0)this.tryPair();
  if(b.state==='idle'&&b.t>36){const a=this.seq[this.si++%this.seq.length],pk=MOVES[a];b.atk=a;b.su=pk.su;b.ac=pk.ac;b.rc=pk.rc;b.set('punch');b.hitAt=pk.su;b.hitTimes=[pk.su];b.total=pk.su+pk.ac+pk.rc;}
  if(b.state==='punch'&&b.t>=b.total)b.set('idle');animBoxer(b,this.fr);}
 draw(){drawScene('arena',600,1,0);drawActor(ctx,{L:this.b.L,B:this.b.B,P:this.b.P,x:600,y:GROUND,face:1,o:{expr:'angry'}});ringFront(ctx);drawFore('arena',600,1);post();}
}

const NET_ST={idle:1,guard:1,duck:1,hit:1,stagger:1,down:1,rise:1,thrown:1,tired:1,walk:1,raised:1,stand:1,kneel:1};
class OnlineFight extends Fight{
 constructor(mr,opp){
  const o=opp.presence,st=netStyle(o.s),oL=netLook(o.L),stats=netStats(o.stats),myL=styled(LOOKS.taesan_box,1);if(!oL.trunks||oL.trunks===myL.trunks){oL.trunks='#1565c0';oL.trim='#90caf9';}if(oL.glove===myL.glove)oL.glove='#1976d2';LOOKS.__opp=oL;
  let h=0;for(const ch of mr.name)h=(h*31+ch.charCodeAt(0))|0;const bg=['title','tokyo'][Math.abs(h)%2];
  super({title:'온라인 대전',mode:'online',bg,amb:'crowd',pLook:'taesan_box',rounds:1,time:90,
   enemy:{name:String(o.n||'상대').slice(0,10),look:'__opp',stats,dmgScale:1,rec:'온라인 '+String(o.rec||'').slice(0,16),h:clamp(+o.h||176,150,205),ai:{}}},{done:()=>{}});
  const ME=STYLES[netStyle(G.cus.style)],OS=STYLES[st];
  this.p.L=styled(LOOKS.taesan_box,1);this.eset=OS.set;this.esp=OS.sp;this.okMoves=new Set([...OS.set,OS.sp]);
  this.e=new Boxer({L:oL,B:netBuild(o.B),stats,x:695,face:-1,name:this.d.enemy.name,dodge:OS.dodge,reachB:(this.d.enemy.h-176)*.7});
  if(HASRING[bg])this.ref={x:600,P:copyPose(PS.stand),state:'stand',t:0,face:1,tx:600};
  this.phase='vs';this.oppElo=+o.elo||1000;this.oppSe=+o.se||1000;this.mr=mr;this.opp=opp.peer;this.rp=o;this.lastA=o.a||0;this.lastCn=o.cn||0;this.lastHn=o.hn||0;this.myA=0;this.myCn=0;this.myHn=0;this.gone=0;
  this.pend={a:0,k:null,cn:0,hn:0,hk:null,ko:0,fin:null,ft:1};
  this.unsubM=mr.onPeers(ch=>{const p=ch.peers.find(x=>x.peer===this.opp);if(p){this.rp=p.presence;this.gone=0;}else if(!this.gone)this.gone=performance.now();});}
 pub(o){Object.assign(this.pend,o);}
 flush(){const p=this.p;Object.assign(this.pend,{x:Math.round(p.x),fc:p.face,st:p.state,hf:+(p.hp/p.maxHp).toFixed(3),sf:+(p.st/p.maxSt).toFixed(2),sp:Math.round(p.sp),cb:p.combo|0,hz:p.hitPose||'hit'});
  if(this.fr%12===0){const w={},bw={};for(const k in p.w)w[k]=r2(p.w[k]);for(const k in p.bw)bw[k]=r2(p.bw[k]);Object.assign(this.pend,{w,bw,gb:r2(p.gb),lg:r2(p.leg)});}
  const pt=this.pend;this.pend={};if(this.mr)this.mr.presence(pt).catch(()=>{});}
 startPunch(b,type,tell){super.startPunch(b,type,tell);if(b===this.p&&b.state==='punch'){this.myA++;this.pub({a:this.myA,k:type,ctr:b.counter>0?1:0});}}
 startSpecial(b,mv){super.startSpecial(b,mv);if(b===this.p){this.myCn++;this.pub({cn:this.myCn});this.flush();}}
 resolve(a,d){if(d===this.e||this.phase!=='fight')return;const hp0=d.hp,s0=d.state,as0=a.state;super.resolve(a,d);
  let r;if(a.state==='stagger'&&as0!=='stagger')r='c';else if(d.hp<hp0)r=s0==='guard'?'b':'h';else if(s0==='duck')r='d';else return;
  this.myHn++;this.pub({hn:this.myHn,hk:{k:a.atk,r,dm:r2(hp0-d.hp),c:this.flash>0?1:0}});}
 showHit(h){const e=this.e,p=this.p,pk=MOVES[h.k]||MOVES[this.pset[0]],[hx,hy]=e.head(),s=e.L.big||1;
  const fxp=pk.tgt==='leg'?[e.x-12,GROUND-70*s]:pk.tgt==='body'?[e.x-16,GROUND-165*s]:[hx,hy];
  if(h.r==='d'){this.fx.text(hx,hy-30,DODGE[e.dodge].nm,'#90caf9',20);SFX.whoosh();return;}
  if(h.r==='c'){p.set('stagger',36);p.hitTimes=[];this.fx.text(hx,hy-40,'킥 캐치!','#81d4fa',28);SFX.block();return;}
  if(h.r==='b'){SFX.block();this.fx.sweat(hx-10,hy+24,1,3);return;}
  const dm=clamp(+h.dm||4,0,60),crit=!!h.c,big=crit||dm>8;p.landed++;p.rdLanded++;this.addCombo(p);this.gainSp(p,dm*2.2);
  this.stop=crit?8:dm>8?6:3;this.shake=crit?9:dm>8?6:2.5;if(crit)this.flash=6;
  this.fx.ring(fxp[0]-12,fxp[1]+6,big);this.fx.sweat(fxp[0],fxp[1],1,crit?14:dm>8?9:5);
  if(pk.tgt!=='leg'&&pk.tgt!=='body'){const bl=this.bleedLv(e);if(bl>0&&dm>3){this.fx.blood(hx+10,hy+12,1,Math.round(3+bl*12+(crit?5:0)),1+bl*.6);p.gb=Math.min(1,p.gb+.07+bl*.12);}}
  crit?SFX.crit():SFX.hit(Math.min(6,dm/2));AU.swell(Math.min(1.5,dm/12));}
 syncE(full){const e=this.e,r=this.rp||{};
  if(isFinite(+r.x))e.x+=(1200-r.x-e.x)*.3;
  e.hp=clamp(+r.hf||0,0,1)*e.maxHp;e.st=clamp(+r.sf||0,0,1)*e.maxSt;e.sp=clamp(+r.sp||0,0,100);e.combo=clamp(r.cb|0,0,30);
  if(r.w)e.w=netW(r.w,['eye','cheek','nose','lip','jaw','brow','smear']);if(r.bw)e.bw=netW(r.bw,['rib','abs','side']);if(r.gb!=null)e.gb=clamp(+r.gb||0,0,1);if(r.lg!=null)e.leg=clamp(+r.lg||0,0,80);
  if((r.hn|0)!==this.lastHn){this.lastHn=r.hn|0;if(full&&r.hk)this.showHit(r.hk);}
  if(!full)return;
  if((r.cn|0)!==this.lastCn){this.lastCn=r.cn|0;if(e.state!=='punch'){e.set('charge',60);const[hx,hy]=e.head();this.fx.text(hx,hy-60,'필살기!','#ff5252',30);SFX.special();this.flash=6;}}
  if((r.a|0)!==this.lastA){this.lastA=r.a|0;if(this.okMoves.has(r.k)&&!['down','thrown','rise'].includes(e.state)){this.startPunch(e,r.k,0);e.counter=r.ctr?42:0;}}
  if(e.state==='punch'){this.punchTick(e,this.p);if(e.state==='punch'&&e.t>=e.total)e.set('idle');}
  else if(e.state==='charge'&&e.t<60){}
  else if(NET_ST[r.st]&&r.st!==e.state){const s=r.st;if(s==='hit'||s==='stagger'||s==='down'||s==='thrown')e.fromP=copyPose(e.P);if(s==='hit'||s==='stagger')e.hitPose=['hit','hitB','hitL','hitS','hitU','hitH','hitK'].includes(r.hz)?r.hz:'hit';
   e.set(s,{duck:24,hit:16,stagger:40,rise:42,thrown:58}[s]||0);}
  if(r.fc)e.face=-(r.fc>0?1:-1);}
 updE(){this.syncE(true);}
 separate(){const p=this.p,e=this.e,lo=HASRING[this.d.bg]?235:150,hi=HASRING[this.d.bg]?965:1050;if(e.x-p.x<96)p.x=e.x-96;p.x=clamp(p.x,lo,hi);}
 updTimer(){if(--this.timer>0)return;this.timer=0;this.myFin=Math.round(this.p.hp/this.p.maxHp*1000);this.pub({fin:this.myFin});
  this.phase='final';this.pt=0;SFX.bell(2);for(const b of[this.p,this.e]){b.set('idle');b.queue=[];}resetHeld();setCtrl('dim');spBtn(false);}
 updFinal(){const r=this.rp||{};if(r.fin!=null||this.pt>600){const of=r.fin!=null?clamp(r.fin|0,0,1000):Math.round(this.e.hp/this.e.maxHp*1000);this.oppFin=of;
   if(this.myFin===of)this.finish(false,'draw');else this.finish(this.myFin>of,'판정');}}
 finish(win,method){if(this.phase==='end')return;super.finish(win,method);this.endType=win?'match':'lose';
  if(!win&&method==='KO')this.pub({ko:1});
  if(method==='draw')NET.rec.d=(NET.rec.d|0)+1;else if(win)NET.rec.w=(NET.rec.w|0)+1;else NET.rec.l=(NET.rec.l|0)+1;netSaveRec();if(typeof rankAfter==='function')this.rankDelta=rankAfter(this);if(typeof addMoney==='function')addMoney(method==='draw'?400:win?(method==='forfeit'?500:1500):200,win?'온라인 승리 상금':'파이트머니');
  if(win){SFX.cheer();SFX.bell(3);AU.swell(2);}}
 step(){const r=this.rp||{};
  if(this.phase==='final'){this.pt++;this.p.t++;this.e.t++;this.updFinal();animBoxer(this.p,this.fr);animBoxer(this.e,this.fr);this.fx.update();this.flush();return;}
  if(this.phase!=='end'){
   if(r.ko&&this.phase!=='down'){this.fx.text(600,170,'K.O.!','#ffd54f',44);this.e.fromP=copyPose(this.e.P);this.e.set('down');SFX.down();this.slow=36;this.flash=8;this.finish(true,'KO');}
   else if(this.gone&&performance.now()-this.gone>3500){this.fx.text(600,170,'상대가 나갔다','#fff',30);this.finish(true,'forfeit');}}
  super.step();
  if(this.phase!=='fight'&&this.phase!=='end')this.syncE(false);
  if(this.phase!=='end'||this.pt<5)this.flush();}
 showResult(){const p=this.p,acc=p.thrown?Math.round(p.landed/p.thrown*100):0,m=this.method;
  const title=m==='draw'?'무승부':this.win?({KO:'K.O. 승','판정':'판정승',forfeit:'부전승'}[m]||'승리'):({KO:'K.O. 패','판정':'판정패'}[m]||'패배');
  const ex=this.myFin!=null&&this.oppFin!=null?`<p>남은 체력 ${Math.round(this.myFin/10)}% : ${Math.round(this.oppFin/10)}%</p>`:'';
  showMenu(`<div class="panel"><p class="sub">온라인 대전 · vs ${esc(this.e.name)}</p><h2>${title}</h2>${ex}<p>공격 ${p.thrown}회 · 적중 ${p.landed}회 (${acc}%) · 최대 콤보 ${this.stats.maxCombo}<br>온라인 전적 ${netRec()}</p>${this.rankDelta!=null?`<p style="font-size:18px;font-weight:900">🏆 랭킹 ${fmtM(RANK.elo)}점 <span style="color:${this.rankDelta>=0?'#7ee787':'#ff7b7b'}">(${this.rankDelta>=0?'+':''}${this.rankDelta})</span></p>`:''}</div>`,
   [{t:'로비로',f:()=>{this.leave();hideMenu();Game.set(new Online());}},{t:'체육관으로',alt:true,f:()=>{this.leave();hideMenu();Game.hub();}}]);}
 leave(){if(this.unsubM)this.unsubM();this.unsubM=null;if(this.mr)this.mr.leave().catch(()=>{});this.mr=null;NET.mr=null;}
}

async function shareGame(){const data={title:'주먹의 길',text:'🥊 주먹의 길 — 내 선수를 키워 AI 사다리를 올라라!',url:GAME_LINK};
 try{if(navigator.share){await navigator.share(data);return;}}catch(e){if(e&&e.name==='AbortError')return;}
 try{await navigator.clipboard.writeText(GAME_LINK);toast('🔗 링크를 복사했다');return;}catch(e){}
 const back=()=>refreshScene();showMenu(`<div class="panel sheet"><div class="sheet-ic">🔗</div><h2>게임 링크</h2><p class="hint">길게 눌러 복사하세요</p><input class="ain" readonly value="${GAME_LINK}" onclick="this.select()"></div>`,[{t:'닫기',alt:true,f:back}]);}
{const _m=Hub.prototype.menu;Hub.prototype.menu=function(){_m.call(this);const tb=document.querySelector('#menu .topbar > div:last-child');

Hub.prototype.guide=function(){
 showMenu(`<div class="panel sheet guide"><div class="sheet-ic">🥊</div><h2>주먹의 길에 온 걸 환영해요</h2>
  <div class="gsteps"><div><b>1</b><span><em>🏋️ 훈련</em>하루 3번 운동하고 잠을 자면 근육이 자라요. 식단과 피로도 중요해요.</span></div>

/* 일시정지 메뉴 정리 */
PauseUI.main=function(){const c=G.cus,sc=Game.scene,inFight=sc instanceof Fight,online=typeof OnlineFight!=='undefined'&&sc instanceof OnlineFight;
 const b=[{t:'계속하기',f:resumeGame},{t:AU.muted?'🔊 소리 켜기':'🔇 소리 끄기',alt:true,f:()=>{AU.mute(!AU.muted);$('mute').textContent=AU.muted?'🔇':'🔊';PauseUI.main();}}];
 if(inFight&&!online)b.push({t:'기권하고 체육관으로',alt:true,f:()=>{Game.paused=false;hideMenu();saveGame();Game.hub();}});
 else if(online)b.push({t:'대전 나가기',alt:true,f:()=>{Game.paused=false;try{sc.leave();}catch(e){}hideMenu();Game.hub();}});
 else if(G.v4)b.push({t:'체육관으로',alt:true,f:()=>{Game.paused=false;hideMenu();Game.hub();}});
 b.push({t:'타이틀로',alt:true,f:()=>{Game.paused=false;saveGame();hideMenu();hideDialog();Game.title();}});
 showMenu(`<div class="panel sheet"><p class="sub">PAUSE</p><h2>일시정지</h2><div class="chips" style="justify-content:center"><span class="chip">${esc(c.name)}</span><span class="chip">${STYLES[c.style].nm}</span><span class="chip">${weightClass(c.w)}</span></div>
  ${online?'<p class="hint">⚠ 온라인 대전은 멈추지 않아요. 상대는 계속 움직여요.</p>':''}</div>`,b);};

/* 조작법: 종목별 실제 기술 이름으로 */

 showMenu(`<div class="panel"><h2>조작법</h2><table class="keys"><tr><td>◀ ▶</td><td>뒤로 · 앞으로 (A/D, ←/→) — 거리 조절이 핵심</td></tr><tr><td>공격 1~4</td><td>화면 오른쪽 버튼 (J · K · L · I)</td></tr><tr><td>가드</td><td>누르는 동안 방어 (S/↓)</td></tr><tr><td>회피</td><td>피한 직후 공격하면 카운터 (W/↑)</td></tr><tr><td>필살기</td><td>기세 게이지가 차면 [필살기] 버튼 (Q)</td></tr><tr><td>메뉴</td><td>⏸ 버튼 (Esc)</td></tr></table>
  <h2 style="font-size:20px;margin-top:14px">종목별 기술</h2><table class="keys">${Object.keys(STYLES).map(rowS).join('')}</table></div>`,[{t:'뒤로',alt:true,f:()=>this.menu()}]);};
